<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 03 - Eventos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Práctica 03: Eventos en JS</h1>
    
    <section>
        <h2>Contacto</h2>
        <form id="miFormulario">
            <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
            <input type="email" id="email" placeholder="Ingresa tu correo" required>
            <button type="submit">Enviar</button>
            <p id="mensajeFormulario"></p>
        </form>
    </section>

    <section>
        <h2>Gestor de Tareas</h2>
        <input type="text" id="inputTarea" placeholder="Escribe una tarea y presiona Enter o Ctrl+Enter">
        <button id="btnAgregar">Agregar Tarea</button>
        <p>Total de tareas pendientes: <strong id="contadorTareas">0</strong></p>
        
        <ul id="listaTareas">
            </ul>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
