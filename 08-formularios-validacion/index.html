<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 08 | Validación de Formularios</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container fade-in">
        <header class="header">
            <h1>Registro de Usuario</h1>
            <p>Formularios y Validación con JavaScript</p>
        </header>

        <div id="mensaje-global"></div>

        <form id="form-registro" class="form-registro" novalidate>
            
            <div class="campo-grupo">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. David Larriva" required minlength="3">
            </div>

            <div class="campo-grupo">
                <label for="email">Correo Electrónico *</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo-grupo">
                <label for="telefono">Teléfono Celular *</label>
                <input type="tel" id="telefono" name="telefono" placeholder="0987654321" required>
            </div>

            <div class="campo-grupo">
                <label for="fecha_nacimiento">Fecha de Nacimiento *</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <div class="campo-grupo">
                <label for="genero">Género *</label>
                <select id="genero" name="genero" required>
                    <option value="">Seleccionar...</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="campo-grupo">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                <div class="password-strength" id="password-strength">Fuerza: Ninguna</div>
            </div>

            <div class="campo-grupo">
                <label for="confirmar">Confirmar contraseña *</label>
                <input type="password" id="confirmar" name="confirmar_password" placeholder="Repite tu contraseña" required>
            </div>

            <div class="campo-grupo checkbox-grupo">
                <label class="checkbox-label">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    Acepto los términos y condiciones *
                </label>
            </div>

            <button type="submit" id="btn-enviar" disabled>Crear Cuenta</button>
        </form>
    </div>

    <script src="js/validacion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
